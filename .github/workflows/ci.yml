name: DevOps CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-guess-wrapper: true
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black

    - name: Code Linting with Flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Code Formatting Check with Black
      run: |
        black --check src/

    - name: Run Unit Tests with Pytest
      run: |
        pytest src/test_main.py -v

  build-docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image (Verify Dockerfile)
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false # Do not push to registry (Docker Hub/ECR) for CI validation
        tags: iot-devops-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
